framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            ocr:
                dsn: '%env(MESSENGER_OCR_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: ocr
                        type: direct
                        default_publish_routing_key: ocr
                    queues:
                        ocr:
                            binding_keys:
                                - ocr
            groq:
                dsn: '%env(MESSENGER_GROQ_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: groq
                        type: direct
                        default_publish_routing_key: groq
                    queues:
                        groq:
                            binding_keys:
                                - groq

            cancel:
                dsn: '%env(MESSENGER_CANCEL_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: cancel
                        type: direct
                        default_publish_routing_key: cancel
                    queues:
                        cancel:
                            binding_keys:
                                - cancel
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # 'App\Message\YourMessage': async
            'App\Message\ProcessReceiptOcrMessage': ocr
            'App\Message\ProcessReceiptGroqMessage': groq
            'App\Message\ProcessReceiptCancelMessage': cancel

