global:
    scrape_interval: 5s
    evaluation_interval: 5s

scrape_configs:

    # Сам Prometheus
    -   job_name: prometheus
        static_configs:
            -   targets:
                    - prometheus:9090

    # Symfony application
    -   job_name: receiptor
        static_configs:
            -   targets:
                    - nginx:80
        metrics_path: /metrics

    # Docker containers
    -   job_name: cadvisor
        static_configs:
            -   targets:
                    - cadvisor:8080

    # Host machine
    -   job_name: node
        static_configs:
            -   targets:
                    - node-exporter:9100

    # PostgreSQL
    -   job_name: postgres
        static_configs:
            -   targets:
                    - postgres-exporter:9187

    # RabbitMQ
    -   job_name: rabbitmq
        metrics_path: /metrics/per-object
        static_configs:
            -   targets:
                    - rabbitmq:15692
