services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
            - php_var:/var/www/html/var
        depends_on:
            database:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    ocr-worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php bin/console messenger:consume ocr --time-limit=3600 -vv
        volumes:
            - .:/var/www/html
            - ocr_worker_var:/var/www/html/var
        depends_on:
            database:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    groq-worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php bin/console messenger:consume groq --time-limit=3600 -vv
        volumes:
            - .:/var/www/html
            - groq_worker_var:/var/www/html/var
        depends_on:
            database:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    cancel-worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php bin/console messenger:consume cancel --time-limit=3600 -vv
        volumes:
            - .:/var/www/html
            - cancel_worker_var:/var/www/html/var
        depends_on:
            database:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    nginx:
        image: nginx:1.29.5-alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
    ###> doctrine/doctrine-bundle ###
    database:
        image: postgres:${POSTGRES_VERSION:-16}-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            # You should definitely change the password in production
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
        ports:
            - "5432:5432"
        healthcheck:
            test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}" ]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - database_data:/var/lib/postgresql/data:rw
            # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
            # - ./docker/db/data:/var/lib/postgresql/data:rw
    ###< doctrine/doctrine-bundle ###
    minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio_data:/data

    redis:
        image: redis:8-alpine
        command: redis-server --appendonly yes
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

    rabbitmq:
        image: rabbitmq:4-management
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
            interval: 5s
            timeout: 5s
            retries: 10

    mercure:
        image: dunglas/mercure:v0.24
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
            MERCURE_EXTRA_DIRECTIVES: |
                protocol_version_compatibility 7
                anonymous
                cors_origins http://localhost:8080
        ports:
            - "8081:80"
        volumes:
            - mercure_data:/data
            - mercure_config:/config

    prometheus:
        image: prom/prometheus:v3.15.0
        restart: unless-stopped
        ports:
            - "9090:9090"
        volumes:
            - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
        depends_on:
            - cadvisor
            - postgres-exporter

    grafana:
        image: grafana/grafana:13.2.3
        restart: unless-stopped
        ports:
            - "8008:3000"
        volumes:
            - grafana_data:/var/lib/grafana
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            - prometheus

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.55.1
        restart: unless-stopped
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:rw
            - /sys:/sys:ro
            - /var/lib/docker:/var/lib/docker:ro
            - /dev/disk:/dev/disk:ro

    node-exporter:
        image: prom/node-exporter:v1.12.1
        restart: unless-stopped
        command:
            - "--path.rootfs=/host"
        volumes:
            - "/:/host:ro,rslave"

    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:v0.20.1
        restart: unless-stopped
        environment:
            DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable"
        depends_on:
            - database

volumes:
    ###> doctrine/doctrine-bundle ###
    database_data:
    ###< doctrine/doctrine-bundle ###
    minio_data:
    redis_data:
    mercure_data:
    mercure_config:
    prometheus_data:
    grafana_data:
    php_var:
    ocr_worker_var:
    groq_worker_var:
    cancel_worker_var:
    rabbitmq_data:
